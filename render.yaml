services:
  - type: web
    runtime: docker
    name: partcast-npg-api
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SETUP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: NPG Autoparts - PartCast
      - key: BACKUP_RETENTION_DAYS
        value: "30"

  - type: web
    runtime: static
    name: partcast-npg-web
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
